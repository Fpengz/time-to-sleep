name: CI & Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Run Pytest
        run: uv run pytest

  build-macos:
    name: Build macOS Menu Bar App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS App
        working-directory: macOS
        run: ./build.sh

      - name: Package DMG
        working-directory: macOS
        run: ./package_dmg.sh

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Time-to-Sleep-macOS-DMG
          path: macOS/Time-to-Sleep.dmg
